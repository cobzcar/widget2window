name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Si les secrets de signature existent, on recrée le fichier de clé (en retirant espaces et retours à la ligne
      # éventuellement ajoutés au collage) ; sinon l'APK est signé en mode débogage.
      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_RAW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD_RAW: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD_RAW" | tr -d '[:space:]')" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$(printf '%s' "$KEY_PASSWORD_RAW" | tr -d '[:space:]')" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$(printf '%s' "$KEY_ALIAS_RAW" | tr -d '[:space:]')" >> "$GITHUB_ENV"
            echo "Clé de signature fixe trouvée."
          else
            echo "Pas de clé de signature : signature de débogage."
          fi

      - name: Vérifier la clé de signature (fichier, mot de passe, alias)
        if: env.KEYSTORE_FILE != ''
        run: |
          out=$(keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1) || {
            echo "::error::Clé illisible. keytool: $(echo "$out" | head -2 | tr '\n' ' ') | taille=$(stat -c%s "$KEYSTORE_FILE") sha256=$(sha256sum "$KEYSTORE_FILE" | cut -c1-16) lg_mdp=${#KEYSTORE_PASSWORD} lg_alias=${#KEY_ALIAS}"
            exit 1
          }
          echo "Clé de signature valide."

      - name: Compiler l'APK
        shell: bash
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$( { grep -E "^e: |Could not (resolve|find|get)|error:|Unresolved" "$RUNNER_TEMP/build.log" | head -6; grep -m1 -A14 "An issue was found" "$RUNNER_TEMP/build.log"; } | cut -c1-400 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Erreur de compilation::$msg"
          fi
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: widget2window-apk
          path: app/build/outputs/apk/release/app-release.apk
